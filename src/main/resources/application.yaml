spring:
  application:
    name: erp-worker

  main:
    allow-bean-definition-overriding: true

  batch:
    job:
      enabled: true

  # MongoDB - Spring Boot 4.x
  data:
    mongodb:
      auto-index-creation: true

    # Redis
    redis:
      host: localhost
      port: 6379
      password: secret
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  mongodb:
    uri: mongodb://debuggeandoideas:secret@localhost:27017/erp_catalog_db?authSource=admin
  h2:
    console:
      enabled: true
# Server
server:
  port: 9091

# Logging
logging:
  level:
    org.springframework.jdbc: ${LOG_LEVEL_DATA:DEBUG}
    org.springframework.batch: ${LOG_LEVEL_DATA:DEBUG}
    org.mongodb.driver: ${LOG_LEVEL_MONGO:DEBUG}